; ===== Custom PlatformIO Override for WLED-MM =====
; Variants:
; - S: AudioReactive only (Base)
; - M: AudioReactive + Battery
; - L: AudioReactive + Battery + ArtiFX (no DMX, and no ArtiFX on C3)

[platformio]
default_envs = esp32_S, esp32_M, esp32_L, esp32s2_S, esp32s2_M, esp32s2_L, esp32c3_S, esp32c3_M

[common_mm]
; Feature flags
wiring_flags = 
  -D LEDPIN=4
  -D DEFAULT_LED_COUNT=100
  -D SERVERNAME='"WLED-RopeLight"'
  -D ABL_MILLIAMPS_DEFAULT=1500
  -D I2S_SDPIN=26 
  -D I2S_WSPIN=19 
  -D I2S_CKPIN=18
build_flags_S = -D USERMOD_AUDIOREACTIVE -D WLED_DISABLE_INFRARED
build_flags_M = -D USERMOD_BATTERY
build_flags_L = -D USERMOD_ARTIFX         ; Only for ESP32/ESP32-S2

; For ESP32-C3, exclude ArtiFX due to flash/RAM limits
build_flags_L_c3 =                         ; Empty to skip ArtiFX

; Optional: shared lib_deps for expandability
lib_deps_S =
lib_deps_M =
lib_deps_L =
lib_deps_L_c3 =

; === ESP32 Standard (esp32dev) ===
[env:esp32_S]
extends = esp32
board = esp32dev
board_build.partitions = ${esp32.default_partitions}
build_flags = ${common.build_flags} ${esp32.build_flags} ${common_mm.build_flags_S} ${common_mm.wiring_flags}
lib_deps = ${esp32.lib_deps} ${common_mm.lib_deps_S} ${common_mm.AR_lib_deps}     

[env:esp32_M]
extends = env:esp32_S
build_flags = ${env:esp32_S.build_flags} ${common_mm.build_flags_M} ${common_mm.wiring_flags}
lib_deps = ${env:esp32_S.lib_deps} ${common_mm.lib_deps_M} ${common_mm.AR_lib_deps}     

[env:esp32_L]
extends = env:esp32_M
build_flags = ${env:esp32_M.build_flags} ${common_mm.build_flags_L} ${common_mm.wiring_flags}
lib_deps = ${env:esp32_M.lib_deps} ${common_mm.lib_deps_L} ${common_mm.AR_lib_deps}     

; === ESP32-S2 (Lolin S2 Mini) ===
[env:esp32s2_S]
extends = esp32s2
board = lolin_s2_mini
board_build.partitions = ${esp32.default_partitions}
build_flags = ${common.build_flags} ${esp32s2.build_flags} ${common_mm.build_flags_S} ${common_mm.wiring_flags}
lib_deps = ${esp32s2.lib_deps} ${common_mm.lib_deps_S} ${common_mm.AR_lib_deps}

[env:esp32s2_M]
extends = env:esp32s2_S
build_flags = ${env:esp32s2_S.build_flags} ${common_mm.build_flags_M} ${common_mm.wiring_flags}
lib_deps = ${env:esp32s2_S.lib_deps} ${common_mm.lib_deps_M} ${common_mm.AR_lib_deps}

[env:esp32s2_L]
extends = env:esp32s2_M
build_flags = ${env:esp32s2_M.build_flags} ${common_mm.build_flags_L} ${common_mm.wiring_flags}
lib_deps = ${env:esp32s2_M.lib_deps} ${common_mm.lib_deps_L} ${common_mm.AR_lib_deps}

; === ESP32-C3 (esp32-c3-devkitm-1) ===
[env:esp32c3_S]
extends = esp32c3dev
board = esp32-c3-devkitm-1
platform = ${esp32.platformV4}
platform_packages = ${esp32.platformV4_packages}
board_build.partitions = ${esp32.default_partitions}
build_flags = ${common.build_flags} ${esp32c3.build_flags} ${common_mm.build_flags_S} -DLOLIN_WIFI_FIX ${common_mm.wiring_flags}
lib_deps = ${esp32c3.lib_deps} ${common_mm.lib_deps_S} ${common_mm.AR_lib_deps}

[env:esp32c3_M]
extends = env:esp32c3_S
build_flags = ${env:esp32c3_S.build_flags} ${common_mm.build_flags_M} -DLOLIN_WIFI_FIX ${common_mm.wiring_flags}
lib_deps = ${env:esp32c3_S.lib_deps} ${common_mm.lib_deps_M} ${common_mm.AR_lib_deps}
