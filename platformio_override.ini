; ===== Platform Override for Personal WLED-MM Projects =====
; Variants:
; - S: AudioReactive only (Base Flash)
; - M: AudioReactive + Battery (LiPo)
; - L: AudioReactive + Battery + DMX (Art-Net)

[platformio]
default_envs = blue_S

; === BlueBoard (ESP32) ===
[env:blue_S]
extends = base_esp32
build_flags = -DWLED_AUDIO_REACTIVE
board = esp32dev

[env:blue_M]
extends = base_esp32
build_flags = 
  -DWLED_AUDIO_REACTIVE
  -DWLED_USE_BATTERY
board = esp32dev

[env:blue_L]
extends = base_esp32
build_flags = 
  -DWLED_AUDIO_REACTIVE
  -DWLED_USE_BATTERY
  -DWLED_ENABLE_DMX
board = esp32dev

; === PurpleBoard (ESP32-S2) ===
[env:purple_S]
extends = base_esp32s2
build_flags = -DWLED_AUDIO_REACTIVE
board = esp32-s2-saola-1

[env:purple_M]
extends = base_esp32s2
build_flags = 
  -DWLED_AUDIO_REACTIVE
  -DWLED_USE_BATTERY
board = esp32-s2-saola-1

[env:purple_L]
extends = base_esp32s2
build_flags = 
  -DWLED_AUDIO_REACTIVE
  -DWLED_USE_BATTERY
  -DWLED_ENABLE_DMX
board = esp32-s2-saola-1

; === BlackBoard (ESP32-C3) ===
[env:black_S]
extends = base_esp32c3
build_flags = -DWLED_AUDIO_REACTIVE
board = esp32-c3-devkitm-1

[env:black_M]
extends = base_esp32c3
build_flags = 
  -DWLED_AUDIO_REACTIVE
  -DWLED_USE_BATTERY
board = esp32-c3-devkitm-1

[env:black_L]
extends = base_esp32c3
build_flags = 
  -DWLED_AUDIO_REACTIVE
  -DWLED_USE_BATTERY
  -DWLED_ENABLE_DMX
board = esp32-c3-devkitm-1

; === Base settings for each ESP variant ===

[env:base_esp32]
platform = espressif32
platform_packages =
  toolchain-xtensa-esp32@^8.4.0
  platformio/framework-arduinoespressif32@^3
framework = arduino
monitor_speed = 115200

[env:base_esp32s2]
platform = espressif32
platform_packages =
  toolchain-xtensa-esp32s2@^8.4.0
  platformio/framework-arduinoespressif32@^3
framework = arduino
monitor_speed = 115200

[env:base_esp32c3]
platform = espressif32
platform_packages =
  toolchain-riscv32-esp@^8.4.0
  platformio/framework-arduinoespressif32@^3
framework = arduino
monitor_speed = 115200