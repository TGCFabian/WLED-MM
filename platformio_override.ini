; ===== Custom PlatformIO Override for WLED-MM =====
; Variants:
; - S: AudioReactive only (Base)
; - M: AudioReactive + Battery
; - L: AudioReactive + Battery + DMX + ArtiFX

[platformio]
default_envs = esp32_S, esp32_M, esp32_L, esp32s2_S, esp32s2_M, esp32s2_L, esp32c3_S, esp32c3_M, esp32c3_L

; === ESP32 Standard ===
[env:esp32_S]
extends = esp32
board = esp32dev
board_build.partitions = ${esp32.default_partitions}
build_flags = ${common.build_flags} ${esp32.build_flags} ${common_mm.build_flags_S}
lib_deps = ${esp32.lib_deps} ${common_mm.lib_deps_S}

[env:esp32_M]
extends = env:esp32_S
build_flags = ${env:esp32_S.build_flags} ${common_mm.build_flags_M}
lib_deps = ${env:esp32_S.lib_deps} ${common_mm.lib_deps_M}

[env:esp32_L]
extends = env:esp32_M
build_flags = ${env:esp32_M.build_flags} ${common_mm.DMXin_build_flags}
lib_deps = ${env:esp32_M.lib_deps} ${common_mm.DMXin_lib_deps}

; === ESP32-S2 (e.g. Lolin S2 Mini) ===
[env:esp32s2_S]
extends = esp32s2
board = lolin_s2_mini
board_build.partitions = ${esp32.default_partitions}
build_flags = ${common.build_flags} ${esp32s2.build_flags} ${common_mm.build_flags_S}
lib_deps = ${esp32s2.lib_deps} ${common_mm.lib_deps_S}

[env:esp32s2_M]
extends = env:esp32s2_S
build_flags = ${env:esp32s2_S.build_flags} ${common_mm.build_flags_M}
lib_deps = ${env:esp32s2_S.lib_deps} ${common_mm.lib_deps_M}

[env:esp32s2_L]
extends = env:esp32s2_M
build_flags = ${env:esp32s2_M.build_flags} ${common_mm.DMXin_build_flags}
lib_deps = ${env:esp32s2_M.lib_deps} ${common_mm.DMXin_lib_deps}

; === ESP32-C3 (e.g. esp32-c3-devkitm-1) ===
[env:esp32c3_S]
extends = esp32c3
board = esp32-c3-devkitm-1
board_build.partitions = ${esp32.default_partitions}
build_flags = ${common.build_flags} ${esp32c3.build_flags} ${common_mm.build_flags_S}
lib_deps = ${esp32c3.lib_deps} ${common_mm.lib_deps_S}

[env:esp32c3_M]
extends = env:esp32c3_S
build_flags = ${env:esp32c3_S.build_flags} ${common_mm.build_flags_M}
lib_deps = ${env:esp32c3_S.lib_deps} ${common_mm.lib_deps_M}

[env:esp32c3_L]
extends = env:esp32c3_M
build_flags = ${env:esp32c3_M.build_flags} ${common_mm.DMXin_build_flags}
lib_deps = ${env:esp32c3_M.lib_deps} ${common_mm.DMXin_lib_deps}
