; ===== Platform Override for Personal WLED-MM Projects =====
; Variants:
; - S: AudioReactive only (Base Flash)
; - M: AudioReactive + Battery (LiPo)
; - L: AudioReactive + Battery + DMX (Art-Net)

[platformio]
default_envs = blue_S

; === BlueBoard (ESP32) ===
[env:blue_S]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DWLED_AUDIO_REACTIVE

[env:blue_M]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -DWLED_AUDIO_REACTIVE
  -DWLED_USE_BATTERY

[env:blue_L]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -DWLED_AUDIO_REACTIVE
  -DWLED_USE_BATTERY
  -DWLED_ENABLE_DMX

; === PurpleBoard (ESP32-S2 - Lolin S2 Mini) ===
[env:purple_S]
